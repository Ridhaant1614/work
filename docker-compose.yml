version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: soneja-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soneja-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=soneja_crm
      - JWT_SECRET=soneja-crm-distribution-secret-key-2026
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_MINUTES=43200
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: soneja-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
